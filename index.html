<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnatic Music Notation Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .blurred-content {
            filter: blur(8px);
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto bg-white shadow-xl rounded-2xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Carnatic Music Notation Generator</h1>
            <p class="text-slate-600">Provide a YouTube link, song name, or upload an audio file to get swara notation.</p>
            <span class="inline-block mt-3 bg-indigo-50 text-indigo-700 font-semibold px-4 py-1.5 rounded-full text-sm">
                Fee: LKR 100 per notation
            </span>
        </div>
        <div class="space-y-4 mb-8">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Google Gemini API Key</label>
                <input type="password" id="apiKey" placeholder="Enter your free Gemini API key" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">YouTube Link or Song Name (Optional)</label>
                <input type="text" id="songInput" placeholder="e.g. https://youtube.com/... or Vatapi Ganapatim" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Or Upload Audio File (MP3 / WAV)</label>
                <input type="file" id="audioInput" accept="audio/*" 
                    class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Raga (Optional)</label>
                    <input type="text" id="ragaInput" placeholder="e.g. Hamsadhwani" 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Instrument</label>
                    <select id="instrumentInput" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="General / Vocal">General / Vocal</option>
                        <option value="Flute">Flute</option>
                        <option value="Violin">Violin</option>
                        <option value="Veena">Veena</option>
                    </select>
                </div>
            </div>
            <button onclick="generateNotation()" id="generateBtn" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200 cursor-pointer shadow-md">
                Generate Notation
            </button>
        </div>
        <div id="loader" class="hidden text-center py-6">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="text-sm text-slate-600 mt-2">AI is processing and generating swara notation...</p>
        </div>
        <div id="resultContainer" class="hidden border border-slate-200 rounded-xl p-6 bg-slate-50 mt-6 relative">
            <div id="paywallOverlay" class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs flex flex-col items-center justify-center rounded-xl p-6 text-center z-10">
                <div class="bg-white p-6 rounded-xl shadow-lg max-w-sm">
                    <h3 class="text-lg font-bold text-slate-900 mb-1">Unlock Full Notation</h3>
                    <p class="text-slate-600 text-sm mb-4">Pay <strong>LKR 100</strong> to view the unblurred notation and download the PDF.</p>
                    
                    <!-- Replace with your LKR payment link (e.g. PayHere / Stripe link) -->
                    <a href="YOUR_LKR_PAYMENT_LINK_HERE" target="_blank" onclick="simulatePaymentSuccess()" 
                       class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg mb-2 transition">
                        Pay LKR 100 Now
                    </a>
                    <button onclick="simulatePaymentSuccess()" class="text-xs text-indigo-600 underline">
                        (Demo: Click here to simulate payment approval)
                    </button>
                </div>
            </div>
            <div id="pdfContent" class="bg-white p-6 rounded-lg shadow-sm blurred-content">
                <h2 id="outputTitle" class="text-xl font-bold text-slate-900 mb-4 border-b pb-2"></h2>
                <div id="outputBody" class="prose max-w-none text-slate-700 space-y-4"></div>
            </div>
            <button id="downloadBtn" onclick="downloadPDF()" disabled 
                class="mt-6 w-full bg-slate-400 text-white font-semibold py-3 rounded-lg cursor-not-allowed transition duration-200 flex items-center justify-center gap-2">
                Download PDF (Unlock First)
            </button>
        </div>
    </div>
    <script>
        async function generateNotation() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const song = document.getElementById('songInput').value.trim();
            const audioFile = document.getElementById('audioInput').files[0];
            const raga = document.getElementById('ragaInput').value.trim();
            const instrument = document.getElementById('instrumentInput').value;
            if (!apiKey) {
                alert('Please enter your Google Gemini API key.');
                return;
            }
            if (!song && !audioFile) {
                alert('Please provide a song name/link or select an audio file.');
                return;
            }
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');
            let prompt = `Generate authentic Carnatic music notation (Swara, Tala, Raga, Arohana, Avarohana, and Sahitya lines) formatted cleanly in HTML tables.`;
            if (song) prompt += ` Song reference: "${song}".`;
            if (audioFile) prompt += ` Audio filename: "${audioFile.name}".`;
            if (raga) prompt += ` Raga: "${raga}".`;
            prompt += ` Instrument style: "${instrument}". Do not include markdown blocks, output direct HTML fragments.`;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let aiText = data.candidates[0].content.parts[0].text;
                    aiText = aiText.replace(/```html/g, '').replace(/```/g, '');

                    document.getElementById('outputTitle').innerText = `Notation for: ${song || audioFile.name}`;
                    document.getElementById('outputBody').innerHTML = aiText;
                    
                    // Show result with blur overlay enabled
                    document.getElementById('resultContainer').classList.remove('hidden');
                    document.getElementById('paywallOverlay').classList.remove('hidden');
                    document.getElementById('pdfContent').classList.add('blurred-content');
                } else {
                    alert('Error generating notation. Check your API key and try again.');
                }
            } catch (error) {
                console.error(error);
                alert('Failed to connect to the AI API.');
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }
        function simulatePaymentSuccess() {
            document.getElementById('paywallOverlay').classList.add('hidden');
            document.getElementById('pdfContent').classList.remove('blurred-content');
            const dlBtn = document.getElementById('downloadBtn');
            dlBtn.disabled = false;
            dlBtn.classList.remove('bg-slate-400', 'cursor-not-allowed');
            dlBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'cursor-pointer');
            dlBtn.innerText = 'Download Notation as PDF';
        }
        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            const options = {
                margin:       10,
                filename:     'carnatic-notation.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(options).save();
        }
    </script>
</body>
</html>
